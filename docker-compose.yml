services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: smarthire
      POSTGRES_USER: smarthire
      POSTGRES_PASSWORD: smarthire
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db_init/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smarthire -d smarthire"]
      interval: 5s
      timeout: 5s
      retries: 10

  ml:
    build: ./ml_service
    ports:
      - "8001:8001"
    environment:
      - MODEL_NAME=all-mpnet-base-v2
    restart: on-failure

  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/smarthire
      SPRING_DATASOURCE_USERNAME: smarthire
      SPRING_DATASOURCE_PASSWORD: smarthire
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      ML_SERVICE_URL: http://ml:8001
      UPLOAD_DIRECTORY: /app/uploads
      # Allow the frontend container (served from port 3000) to call /api/*
      CORS_ALLOWED_ORIGINS: http://localhost:3000
    volumes:
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      ml:
        condition: service_started

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      - CHOKIDAR_USEPOLLING=true
      - DANGEROUSLY_DISABLE_HOST_CHECK=true
      # setupProxy.js reads PROXY_TARGET to forward /api/* to the backend service
      - PROXY_TARGET=http://backend:8080
      # REACT_APP_API_URL is embedded at build time; leave empty so the proxy handles /api/*
      - REACT_APP_API_URL=
    depends_on:
      - backend

volumes:
  pgdata:
  uploads:
