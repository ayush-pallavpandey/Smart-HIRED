spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:smarthire;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: ${SERVER_PORT:8080}

ml:
  service:
    url: ${ML_SERVICE_URL:http://localhost:8001}

upload:
  directory: ${UPLOAD_DIRECTORY:./uploaded_resumes}

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - mappings