spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:smarthire;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  h2:
    console:
      enabled: true
      path: /h2-console
  servlet:
    multipart:
      enabled: true
      max-file-size: 20MB
      max-request-size: 20MB

server:
  port: ${SERVER_PORT:8080}

ml:
  service:
    url: ${ML_SERVICE_URL:http://localhost:8001}

upload:
  directory: ${UPLOAD_DIRECTORY:./uploaded_resumes}

# Comma-separated allowed CORS origins — override via CORS_ALLOWED_ORIGINS env var
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# JWT — override JWT_SECRET in prod with a strong 256-bit value
jwt:
  secret: ${JWT_SECRET:SmartHireDefaultSecretKey_ChangeInProduction_256bits!!}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}   # 24 h

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - mappings
